# =============================================================================
# CONTRACT 2 — Feature Table ML
# =============================================================================

feat_load_forecasting_contract:
  id: dp02-api-feat-load-forecasting-v1
  name: feat_load_forecasting_api_hourly
  version: v1
  status: active
  producer: pipeline-dp02-streaming
  effective_date: "2022-01-01"

interface:
  table: iceberg.gold.feat_load_forecasting_api_hourly
  grain: 1 registo por hora UTC (linhas com lags nulos e sem target excluídas)
  primary_key: ts_utc
  note: >
    As primeiras 24 linhas (lags ainda nulos) e a última linha da série (sem target futuro)
    são excluídas. O dataset está pronto para treino sem pré-processamento adicional.
  consumers:
    - id: ml-training-gbr
      type: ml-training
      script: 03_ml_pipeline/preco_consumo_mlflow_flow.py
      model: GradientBoostingRegressor
      target_column: consumo_next_hour
      metrics_achieved:
        r2: 0.989
        mape_pct: 1.30

schema:
  version: 1
  feature_schema_version: 1
  note: Todas as colunas de dp_energy_market_api_hourly mais consumo_next_hour
  additional_column:
    - name: consumo_next_hour
      type: DOUBLE
      nullable: false
      role: TARGET
      description: >
        Consumo da hora seguinte — LEAD(consumo_total, 1) OVER (ORDER BY ts_utc).
        Variável alvo para o modelo de previsão de carga horária.

quality:
  rules:
    - id: QC-F01
      name: target_nao_nulo
      column: consumo_next_hour
      check: null_rate = 0%
      severity: FAIL

    - id: QC-F02
      name: features_sem_nulos
      check: todos os campos lag e rolling_avg NOT NULL
      severity: FAIL

    - id: QC-F03
      name: paridade_com_produto_analitico
      check: COUNT(feat) >= COUNT(dp) - 48
      severity: WARN
      description: Diferença esperada de até 25 linhas (24 inicio + 1 fim) por re-execução

change_management:
  versioning_property: feature_schema_version
  impact_on_models: >
    Qualquer alteração ao conjunto ou fórmula de features obriga a re-treino.
    Cada run MLflow deve registar feature_schema_version nos tags do run.
  changelog:
    - feature_schema_version: 1
      date: "2022-01-01"
      features: 10
      target: consumo_next_hour
      model_trained: GradientBoostingRegressor (R²=0.989, MAPE=1.30%)
